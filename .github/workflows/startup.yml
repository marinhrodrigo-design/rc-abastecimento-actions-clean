name: R&C Actions clean runner provisioning check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "UBUNTU_RUNNER_OK"

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - run: echo "WINDOWS_RUNNER_OK"
